name: ETF premium monitor

on:
  schedule:
    - cron: "45 1 * * 1-5"
    - cron: "45 2 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "50 6 * * 1-5"
  workflow_dispatch:
    inputs:
      diagnostics:
        description: '打印原始行情 JSON 和字段解释（首次部署请勾选）'
        required: false
        type: boolean
        default: false
      test_notify:
        description: '只测试 ntfy 推送，不检查阈值'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: etf159509-premium-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DIAGNOSTICS: ${{ inputs.diagnostics || false }}
          TEST_NOTIFY: ${{ inputs.test_notify || false }}
        run: |
          args=()
          if [ "$DIAGNOSTICS" = "true" ]; then args+=(--diagnostics); fi
          if [ "$TEST_NOTIFY" = "true" ]; then args+=(--test-notify); fi
          python monitor.py "${args[@]}"

      - name: Commit updated alert state
        if: ${{ success() && inputs.test_notify != true }}
        run: |
          if git diff --quiet -- state.json; then
            echo 'No state changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git commit -m 'Update ETF alert state [skip ci]'
          git push
